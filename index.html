<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6b4f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Workshop Checklist</title>
<style>
  :root {
    --bg: #f6f5f1; --surface: #ffffff; --fg: #1d1f1c; --muted: #6b6f68;
    --line: #dedcd3; --accent: #2f6b4f; --accent-fg: #ffffff; --danger: #a33a2a;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151714; --surface: #1e211d; --fg: #ecebe6; --muted: #9ba197;
      --line: #2f332e; --accent: #7fc09c; --accent-fg: #10140f; --danger: #e08a7b;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-bottom: 40px;
  }
  header { padding-top: max(16px, env(safe-area-inset-top, 0px)); }
  h1 { font-size: 20px; margin: 0 0 12px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 28px 0 8px; }
  button, input, textarea {
    font: inherit; color: inherit; border-radius: 10px; border: 1px solid var(--line);
    background: var(--surface); padding: 10px 12px; max-width: 100%;
  }
  button { cursor: pointer; }
  button.primary, .btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  button.danger { color: var(--danger); }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  textarea { width: 100%; min-height: 64px; }
  form.add { display: grid; gap: 8px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .tabs { display: flex; gap: 8px; margin: 16px 0 4px; }
  .tabs button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 10px;
  }
  label.item { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; }
  label.item input[type="checkbox"] { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--accent); flex: none; padding: 0; }
  .text { min-width: 0; overflow-wrap: anywhere; }
  .title { font-weight: 600; }
  input[type="checkbox"]:checked ~ .text .title { color: var(--muted); text-decoration: line-through; }
  .meta { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
  .card a { color: var(--accent); }
  .photos { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .photos img { width: 84px; height: 84px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .actions button, .btn { padding: 6px 10px; font-size: 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); position: relative; }
  .btn { display: inline-block; cursor: pointer; }
  .sr { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }
  .muted { color: var(--muted); }
  .error { color: var(--danger); }
  .foot { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>

<header>
  <h1>Workshop Checklist</h1>
  <form id="addForm" class="add">
    <textarea id="newText" required placeholder="What do you need?"></textarea>
    <input id="newUrl" type="url" placeholder="Link (optional)">
    <div class="row"><button class="primary" type="submit">Add item</button></div>
  </form>
  <div class="tabs">
    <button type="button" id="tabOpen" aria-pressed="true">Open</button>
    <button type="button" id="tabArchive" aria-pressed="false">Archive</button>
  </div>
</header>

<main id="list"></main>

<section>
  <h2>Move between devices</h2>
  <p class="foot">Your list lives only on this device. Export it here, then import the file on your other device. Importing merges both lists, and if an item was ticked on either device it stays ticked.</p>
  <div class="row">
    <button type="button" id="exportBtn">Export</button>
    <button type="button" id="importBtn">Import</button>
    <input type="file" id="importFile" accept="application/json,.json" class="sr">
  </div>
  <p id="status" class="muted" role="status"></p>
</section>

<script>
(function () {
  "use strict";

  var DB_NAME = "workshop-checklist", STORE = "items";
  var view = "open";
  var items = [];
  var urls = [];

  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  };
  var uid = function () {
    return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2);
  };
  var now = function () { return new Date().toISOString(); };
  var setStatus = function (m) { $("status").textContent = m; $("status").className = "muted"; };
  var fail = function (err) { $("status").textContent = (err && err.message) || String(err); $("status").className = "error"; };

  // ---- Storage (IndexedDB, on this device only) ----
  var dbp = new Promise(function (resolve, reject) {
    var req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = function () { req.result.createObjectStore(STORE, { keyPath: "id" }); };
    req.onsuccess = function () { resolve(req.result); };
    req.onerror = function () { reject(req.error); };
  });

  function tx(mode, fn) {
    return dbp.then(function (db) {
      return new Promise(function (resolve, reject) {
        var t = db.transaction(STORE, mode);
        var req = fn(t.objectStore(STORE));
        t.oncomplete = function () { resolve(req ? req.result : undefined); };
        t.onerror = function () { reject(t.error); };
      });
    });
  }
  var allItems = function () { return tx("readonly", function (s) { return s.getAll(); }); };
  var putItem = function (it) { return tx("readwrite", function (s) { return s.put(it); }); };
  var removeItem = function (id) { return tx("readwrite", function (s) { return s.delete(id); }); };

  function load() {
    return allItems().then(function (rows) {
      items = rows.sort(function (a, b) { return a.createdAt < b.createdAt ? 1 : -1; });
      render();
    });
  }

  function findItem(id) {
    for (var i = 0; i < items.length; i++) if (items[i].id === id) return items[i];
    return null;
  }

  function update(it, changes) {
    Object.assign(it, changes, { updatedAt: now() });
    return putItem(it).then(load);
  }

  // ---- Rendering ----
  function render() {
    urls.forEach(function (u) { URL.revokeObjectURL(u); });
    urls = [];

    var shown = items.filter(function (it) {
      return view === "open" ? it.status === "open" : it.status === "ticked";
    });
    if (view === "archive") {
      shown.sort(function (a, b) { return (a.tickedAt || "") < (b.tickedAt || "") ? 1 : -1; });
    }

    $("list").innerHTML = shown.map(function (it) {
      var id = esc(it.id);
      var link = it.url ? '<div class="meta"><a href="' + esc(it.url) + '" target="_blank" rel="noopener">' + esc(it.url) + "</a></div>" : "";
      var notes = it.notes ? '<div class="meta">' + esc(it.notes) + "</div>" : "";
      var photos = (it.photos || []).map(function (p) {
        return '<img alt="Item photo" data-photo="' + esc(p.id) + '">';
      }).join("");
      return '<article class="card">' +
        '<label class="item">' +
          '<input type="checkbox" data-act="toggle" data-id="' + id + '"' + (it.status === "ticked" ? " checked" : "") + ">" +
          '<span class="text"><span class="title">' + esc(it.text) + "</span>" + notes + link + "</span>" +
        "</label>" +
        (photos ? '<div class="photos">' + photos + "</div>" : "") +
        '<div class="actions">' +
          '<label class="btn">Add photo<input class="sr" type="file" accept="image/*" data-act="photo" data-id="' + id + '"></label>' +
          '<button type="button" data-act="edit" data-id="' + id + '">Edit</button>' +
          '<button type="button" class="danger" data-act="delete" data-id="' + id + '">Delete</button>' +
        "</div>" +
      "</article>";
    }).join("") || '<p class="muted">' + (view === "open" ? "Nothing open. Add an item above." : "The archive is empty.") + "</p>";

    shown.forEach(function (it) {
      (it.photos || []).forEach(function (p) {
        var img = document.querySelector('img[data-photo="' + p.id + '"]');
        if (!img) return;
        var u = URL.createObjectURL(p.blob);
        urls.push(u);
        img.src = u;
      });
    });
  }

  function setView(v) {
    view = v;
    $("tabOpen").setAttribute("aria-pressed", String(v === "open"));
    $("tabArchive").setAttribute("aria-pressed", String(v === "archive"));
    render();
  }

  // ---- Actions ----
  $("addForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var text = $("newText").value.trim();
    if (!text) return;
    var ts = now();
    putItem({
      id: uid(), text: text, notes: null,
      url: $("newUrl").value.trim() || null,
      status: "open", tickedAt: null,
      createdAt: ts, updatedAt: ts, photos: []
    }).then(function () {
      $("newText").value = "";
      $("newUrl").value = "";
      return load();
    }).catch(fail);
  });

  $("tabOpen").addEventListener("click", function () { setView("open"); });
  $("tabArchive").addEventListener("click", function () { setView("archive"); });

  $("list").addEventListener("change", function (e) {
    var el = e.target;
    var act = el.getAttribute("data-act");
    var it = findItem(el.getAttribute("data-id"));
    if (!it) return;
    if (act === "toggle") {
      update(it, el.checked
        ? { status: "ticked", tickedAt: now() }
        : { status: "open", tickedAt: null }).catch(fail);
    } else if (act === "photo" && el.files && el.files[0]) {
      var f = el.files[0];
      var photos = (it.photos || []).concat([{ id: uid(), type: f.type || "image/jpeg", blob: f }]);
      update(it, { photos: photos }).catch(fail);
    }
  });

  $("list").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-act]");
    if (!b) return;
    var it = findItem(b.getAttribute("data-id"));
    if (!it) return;
    var act = b.getAttribute("data-act");
    if (act === "delete") {
      if (!confirm("Delete this item and its photos?")) return;
      removeItem(it.id).then(load).catch(fail);
    } else if (act === "edit") {
      var text = prompt("Item", it.text);
      if (text === null) return;
      var notes = prompt("Notes", it.notes || "");
      if (notes === null) return;
      var url = prompt("Link", it.url || "");
      if (url === null) return;
      update(it, {
        text: text.trim() || it.text,
        notes: notes.trim() || null,
        url: url.trim() || null
      }).catch(fail);
    }
  });

  // ---- Export / import ----
  function blobToDataUrl(blob) {
    return new Promise(function (resolve, reject) {
      var r = new FileReader();
      r.onload = function () { resolve(r.result); };
      r.onerror = function () { reject(r.error); };
      r.readAsDataURL(blob);
    });
  }

  async function exportList() {
    setStatus("Preparing export…");
    var rows = await allItems();
    var out = [];
    for (var it of rows) {
      var photos = [];
      for (var p of (it.photos || [])) {
        photos.push({ id: p.id, type: p.type, data: await blobToDataUrl(p.blob) });
      }
      out.push(Object.assign({}, it, { photos: photos }));
    }
    var file = new Blob(
      [JSON.stringify({ app: "workshop-checklist", version: 1, exportedAt: now(), items: out })],
      { type: "application/json" }
    );
    var a = document.createElement("a");
    a.href = URL.createObjectURL(file);
    a.download = "workshop-checklist-" + now().slice(0, 10) + ".json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 15000);
    setStatus("Exported " + out.length + " items.");
  }

  // Keep the item's text, notes and link from whichever copy was edited last;
  // a tick on either device keeps the item ticked; photos from both copies are kept.
  function mergeItems(a, b) {
    var newer = (b.updatedAt || "") > (a.updatedAt || "") ? b : a;
    var out = Object.assign({}, newer);
    var ticked = a.status === "ticked" || b.status === "ticked";
    out.status = ticked ? "ticked" : "open";
    var ticks = [a.tickedAt, b.tickedAt].filter(Boolean).sort();
    out.tickedAt = ticked && ticks.length ? ticks[0] : null;
    var seen = new Map();
    (a.photos || []).concat(b.photos || []).forEach(function (p) {
      if (!seen.has(p.id)) seen.set(p.id, p);
    });
    out.photos = Array.from(seen.values());
    out.updatedAt = [a.updatedAt || "", b.updatedAt || ""].sort().pop();
    return out;
  }

  async function importFile(f) {
    var data = JSON.parse(await f.text());
    if (!data || data.app !== "workshop-checklist" || !Array.isArray(data.items)) {
      throw new Error("That file is not a checklist export.");
    }
    var local = new Map((await allItems()).map(function (i) { return [i.id, i]; }));
    var added = 0, merged = 0;
    for (var r of data.items) {
      var photos = [];
      for (var p of (r.photos || [])) {
        var blob = await (await fetch(p.data)).blob();
        photos.push({ id: p.id, type: p.type, blob: blob });
      }
      var incoming = Object.assign({}, r, { photos: photos });
      var mine = local.get(r.id);
      if (mine) {
        await putItem(mergeItems(mine, incoming));
        merged++;
      } else {
        await putItem(incoming);
        added++;
      }
    }
    await load();
    setStatus("Imported: " + added + " new, " + merged + " merged with existing items.");
  }

  $("exportBtn").addEventListener("click", function () { exportList().catch(fail); });
  $("importBtn").addEventListener("click", function () { $("importFile").click(); });
  $("importFile").addEventListener("change", function () {
    var f = this.files[0];
    this.value = "";
    if (f) importFile(f).catch(fail);
  });

  // ---- Start ----
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {});
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
  dbp.then(load).catch(fail);
})();
</script>
</body>
</html>
